name: Remove stale branches

on:
  push:
    branches:
      - ops/tag-known-good-2026-09-15

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Keep only main and website
        shell: bash
        run: |
          set -euo pipefail
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          mapfile -t branches < <(git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin | sort -u)
          for branch in "${branches[@]}"; do
            case "$branch" in
              main|website|HEAD|"")
                echo "keeping $branch"
                ;;
              *)
                echo "deleting $branch"
                git push origin --delete "$branch"
                ;;
            esac
          done
