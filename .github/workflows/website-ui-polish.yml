name: One-off website UI polish

on:
  push:
    branches: [website-dev]

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: website-dev
          fetch-depth: 0

      - name: Apply scoped public UI polish
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          site_path = Path('components/PigeonSite.tsx')
          css_path = Path('app/globals.css')
          site = site_path.read_text()
          css = css_path.read_text()

          site = site.replace(
              'import { ArrowRight, Check, Copy, Github, Menu, RotateCcw, X } from "lucide-react";',
              'import { ArrowRight, Check, Copy, Menu, RotateCcw, X } from "lucide-react";'
          )

          site = site.replace(
              '["Python", "in-tree SDK", "Protocol-compatible client with registry publication planned after conformance validation."],\n  ["Rust", "in-tree SDK", "Protocol-compatible client with registry publication planned after conformance validation."],',
              '["Python", "SDK source", "Protocol-compatible Python client for Pigeon Protocol v1."],\n  ["Rust", "SDK source", "Protocol-compatible Rust client for Pigeon Protocol v1."],'
          )

          site = site.replace(
              'className="overflow-hidden rounded-lg border border-line-strong/70 bg-term shadow-[0_24px_60px_-32px_rgba(0,0,0,0.5)]"',
              'className="overflow-hidden rounded-lg border border-line-strong/70 bg-term"'
          )

          site = site.replace(
              '<Github size={15} /> GitHub',
              'GitHub <ArrowRight size={13} className="-rotate-45" aria-hidden="true" />'
          )

          site = site.replace('<PigeonLogo size={112} />', '<PigeonLogo size={148} />')

          site = site.replace(
              'Open source · contract-native messaging',
              'Open-source message broker · contract-native messaging'
          )

          site = site.replace(
              '{view === "developer" ? "Build with the broker, clients and protocol. Switch to Researcher for the authority model and open questions." : "Researcher view focuses on the communication-authority model and its design boundaries."}',
              '{view === "developer" ? "Explore the protocol, quickstart and messaging patterns below." : "Explore the communication-authority model and research questions below."}'
          )

          site = site.replace(
              'title="A broker protocol, not a single-language runtime."\n              copy="The Node broker is the canonical implementation today. Clients use the same contract negotiation and decision semantics through Pigeon Protocol v1."',
              'title="Use PigeonMQ from the runtime you already have."\n              copy="Use the Node.js client, protocol-compatible SDKs, or integrate directly with Pigeon Protocol v1 over HTTP."'
          )

          pattern = re.compile(r'\n        <section id="status">.*?\n        </section>', re.S)
          replacement = '''
        <section id="start" className="border-b border-line">
          <Reveal className="mx-auto max-w-[1320px] px-5 py-20 sm:px-10 sm:py-24">
            <div className="overflow-hidden rounded-lg border border-line-strong bg-panel p-7 sm:p-9 lg:flex lg:items-end lg:justify-between lg:gap-12">
              <div className="max-w-[46rem]">
                <p className="font-mono text-[0.78rem] text-accent">Get started</p>
                <h2 className="mt-4 font-serif text-[2.45rem] leading-[1.04] tracking-[-0.02em] text-ink sm:text-[3.2rem]">Put communication contracts on the message path.</h2>
                <p className="mt-5 max-w-[42rem] text-[1.02rem] leading-7 text-muted">Start a broker locally, connect a producer and consumer, then inspect the contract and broker decision for each message.</p>
              </div>
              <div className="mt-7 flex flex-wrap gap-3 lg:mt-0 lg:justify-end">
                <a href={DOCS} target="_blank" rel="noreferrer" className="inline-flex h-11 items-center rounded-md border border-line-strong bg-bg px-5 text-[0.95rem] font-medium text-ink transition-colors hover:bg-muted-bg">Read docs</a>
                <a href={DEMO} className="inline-flex h-11 items-center gap-2 rounded-md bg-ink px-5 text-[0.95rem] font-medium text-bg transition-transform hover:-translate-y-0.5">Run live demo <ArrowRight size={15} /></a>
                <a href={GITHUB} target="_blank" rel="noreferrer" className="inline-flex h-11 items-center gap-2 rounded-md border border-line px-5 text-[0.95rem] text-muted transition-colors hover:border-line-strong hover:text-ink">GitHub <ArrowRight size={13} className="-rotate-45" aria-hidden="true" /></a>
              </div>
            </div>
          </Reveal>
        </section>'''
          site, count = pattern.subn(replacement, site, count=1)
          if count != 1:
              raise SystemExit(f'Expected to replace one public status section, replaced {count}')

          css = css.replace(
              'width: 132px;\n  min-width: 132px;\n  height: 104px;',
              'width: 174px;\n  min-width: 174px;\n  height: 132px;'
          )
          css = css.replace(
              '.surface-card:hover {\n  transform: translateY(-2px);\n  background: var(--bg-soft);\n}',
              '.surface-card:hover {\n  background: color-mix(in srgb, var(--panel) 82%, var(--muted-bg));\n}'
          )
          css = css.replace(
              '0% { opacity: 0; transform: translate(-10px, 7px) rotate(-1.5deg) scale(.97); }\n  70% { opacity: 1; transform: translate(1px, -1px) rotate(.25deg) scale(1.005); }\n  100% { opacity: 1; transform: translate(0, 0) rotate(0) scale(1); }',
              '0% { opacity: 0; transform: translate(-8px, 6px) scale(.985); }\n  70% { opacity: 1; transform: translate(1px, -1px) scale(1.002); }\n  100% { opacity: 1; transform: translate(0, 0) scale(1); }'
          )
          css = css.replace('transform: translateY(14px);', 'transform: translateY(9px);')
          css = css.replace(
              '.hero-pigeon { width: 104px; min-width: 104px; height: 84px; }',
              '.hero-pigeon { width: 128px; min-width: 128px; height: 98px; }'
          )

          site_path.write_text(site)
          css_path.write_text(css)
          PY

          rm .github/workflows/website-ui-polish.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/PigeonSite.tsx app/globals.css .github/workflows/website-ui-polish.yml
          git diff --cached --check
          git commit -m "fix(website): polish public UI and remove internal status copy"
          git push origin HEAD:website-dev
