name: Release Pipeline

# Release all official Pigeon distributions from one version/tag:
#   npm       -> pigeonmq
#   TestPyPI  -> pigeonmq
#   PyPI      -> pigeonmq
#   crates.io -> pigeonmq
#
# Manual dispatch bumps package.json and synchronises the Python/Rust manifests.
# A pushed v* tag is also supported, but all manifests must already match the tag.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semantic version bump
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
  push:
    tags:
      - 'v*'

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Test and build release artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install broker dependencies
        run: npm ci

      - name: Bump and synchronise release version
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          npm version "${{ inputs.bump }}" --no-git-tag-version

      - name: Resolve and validate release version
        id: version
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          npm run version:check

          if [ "${{ github.event_name }}" = "push" ]; then
            tag="${GITHUB_REF_NAME#v}"
            if [ "$tag" != "$version" ]; then
              echo "::error::Tag v$tag does not match package.json version $version."
              exit 1
            fi
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "Preparing Pigeon v$version"

      - name: Run broker tests
        run: npm test

      - name: Run deterministic broker demo
        run: npm run demo

      - name: Start Pigeon broker for SDK conformance
        shell: bash
        run: |
          node src/server.js > /tmp/pigeon-release.log 2>&1 &
          echo $! > /tmp/pigeon-release.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8787/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/pigeon-release.log
          exit 1

      - name: Test Python SDK against real broker
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./sdk/python pytest
          python -m pytest sdk/python/tests

      - name: Check and test Rust SDK against real broker
        run: |
          cargo fmt --manifest-path sdk/rust/Cargo.toml -- --check
          cargo test --manifest-path sdk/rust/Cargo.toml

      - name: Build Python distributions
        run: |
          python -m pip install build twine
          mkdir -p dist/python
          python -m build sdk/python --outdir dist/python
          python -m twine check dist/python/*

      - name: Validate Rust package
        run: cargo package --manifest-path sdk/rust/Cargo.toml --allow-dirty

      - name: Build npm package
        run: |
          mkdir -p dist/npm
          npm pack --pack-destination dist/npm

      - name: Build release notes
        run: node scripts/changelog-section.mjs "$VERSION" > RELEASE_NOTES.md

      - name: Commit and tag release
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json sdk/python/pyproject.toml sdk/rust/Cargo.toml
          git commit -m "release: v$VERSION"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
          git tag "v$VERSION"
          git push origin "v$VERSION"

      - name: Upload npm package
        uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: dist/npm/*.tgz
          if-no-files-found: error

      - name: Upload Python distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/python/*
          if-no-files-found: error

      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: RELEASE_NOTES.md
          if-no-files-found: error

  npm-publish:
    name: Publish npm
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Ensure npm supports Trusted Publishing
        run: npm install -g npm@latest

      - name: Download npm package
        uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: dist/npm

      - name: Check whether npm version already exists
        id: npm_exists
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          if npm view "pigeonmq@$VERSION" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm with provenance
        if: ${{ steps.npm_exists.outputs.exists != 'true' }}
        run: npm publish dist/npm/*.tgz --provenance --access public

  testpypi-publish:
    name: Publish TestPyPI
    needs: prepare
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/pigeonmq
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download Python distributions
        uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist

      - name: Publish distributions to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
          skip-existing: true

  pypi-publish:
    name: Publish PyPI
    needs:
      - prepare
      - testpypi-publish
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pigeonmq
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download Python distributions
        uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true

  crates-publish:
    name: Publish crates.io
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: v${{ needs.prepare.outputs.version }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check whether crate version already exists
        id: crate_exists
        shell: bash
        run: |
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' "https://crates.io/api/v1/crates/pigeonmq/$VERSION")"
          if [ "$status" = "200" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate with crates.io Trusted Publishing
        if: ${{ steps.crate_exists.outputs.exists != 'true' }}
        id: crates_auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish crate
        if: ${{ steps.crate_exists.outputs.exists != 'true' }}
        run: cargo publish --manifest-path sdk/rust/Cargo.toml
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_auth.outputs.token }}

  github-release:
    name: Create GitHub Release
    needs:
      - prepare
      - npm-publish
      - pypi-publish
      - crates-publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: .

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(needs.prepare.outputs.version, '-') }}
