name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  node:
    name: Broker + JS (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check SDK version alignment
        run: npm run version:check

      - name: Run broker tests
        run: npm test

      - name: Run deterministic demo
        run: npm run demo

  python-sdk:
    name: Python SDK (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install broker dependencies
        run: npm ci

      - name: Start Pigeon broker
        run: |
          node src/server.js > /tmp/pigeon.log 2>&1 &
          echo $! > /tmp/pigeon.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8787/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/pigeon.log
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install Python SDK
        run: python -m pip install ./sdk/python

      - name: Run Python conformance tests
        run: python -m unittest discover -s sdk/python/tests -v

  rust-sdk:
    name: Rust SDK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install broker dependencies
        run: npm ci

      - name: Start Pigeon broker
        run: |
          node src/server.js > /tmp/pigeon.log 2>&1 &
          echo $! > /tmp/pigeon.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8787/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/pigeon.log
          exit 1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check Rust formatting
        run: cargo fmt --manifest-path sdk/rust/Cargo.toml -- --check

      - name: Run Rust conformance tests
        run: cargo test --manifest-path sdk/rust/Cargo.toml
