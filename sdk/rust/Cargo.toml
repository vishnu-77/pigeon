[package]
name = "pigeonmq"
version = "1.0.2"
edition = "2021"
description = "Rust client for the Pigeon contract-native message broker"
license = "Apache-2.0"
repository = "https://github.com/vishnu-77/pigeon"
homepage = "https://pigeonmq.cc"
documentation = "https://pigeonmq.cc"
keywords = ["messaging", "broker", "governance", "contracts"]
categories = ["network-programming", "api-bindings"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
